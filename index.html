<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="붙여넣은 자료로 한 페이지 HTML을 만들 프롬프트를 써 주는 생성기"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>HowSheet</title>
    <script>
      // 테마 플래시 방지. 루트 렌더링보다 먼저 실행돼야 하므로 모듈이 아니라
      // 인라인 스니펫으로 둔다. (File_Structure.md §2.3, 디자인 §2.1.6, 기술 §4.3.1)
      (function () {
        try {
          var stored = localStorage.getItem('howsheet:editor:theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = mode;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themeMode = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 60ch; margin: 2rem auto; padding: 0 1rem; line-height: 1.6">
        HowSheet는 자바스크립트로 동작합니다. 브라우저에서 자바스크립트를 켜면 자료를 붙여넣고
        프롬프트를 만들 수 있습니다. 붙여넣은 자료는 이 브라우저 안에 머무르고, 키를 넣었을 때만
        api.anthropic.com으로 전송됩니다.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
