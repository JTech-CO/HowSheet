name: Release build

# 정적 호스팅 배포. 수동 실행만 연다.
#
# **배포 대상이 아직 정해지지 않았다.** 기본 GitHub Pages 도메인은 계정의 다른
# Pages 사이트와 출처(origin)를 공유하고, 그 출처의 어떤 스크립트든 localStorage에
# 있는 API 키를 읽을 수 있다. 전용 출처를 정하기 전에는 자동 배포를 켜지 않는다.
# (출시 점검 2026-09-16, 제품정의 §7)
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Vite base. 기본값 './'는 끝에 슬래시가 있는 경로에서 동작한다"
        required: false
        default: './'

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    name: 게이트와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 배포 전에는 CI와 **같은** 게이트를 통과해야 한다. 일부만 돌리면 배포
      # 경로가 CI보다 약해지고, 약한 쪽이 실제로 사용자에게 나간다.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm verify:dependencies
      - run: pnpm verify:architecture
      - run: pnpm eval:prompts

      - name: 브라우저 설치
        run: pnpm exec playwright install --with-deps

      - name: test:e2e
        run: pnpm test:e2e

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: 빌드
        run: pnpm build
        env:
          VITE_BASE: ${{ inputs.base }}

      # 라우터가 없다. 경로는 하나뿐이라 SPA 폴백(404.html)이 필요 없다.
      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
